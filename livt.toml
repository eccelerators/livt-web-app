[project]
name = "Livt.WebApp"
version = "0.1.0"
path = "src"
outdir = "out"

[tests]
path = "tests"
components = [
    "IndexHtmlStoreTest",
    "AboutHtmlStoreTest",
    "StatusHtmlStoreTest",
    "ArtyWebAppTest",
    "WebApplicationTest",
    "WebRoutesTest"
]

[dependencies]
"Livt.IO" = "1.2.0-dev"
"Livt.Net" = "1.1.0-dev"
"Livt.Web" = "1.0.0-dev"
"Livt.Base" = "1.1.0"

[vendor.vivado]
part = "xc7a100tcsg324-1"

[vendor.vivado.ip]
component = "ArtyWebApp"
wrapper = "board/webapp_wrapper.vhd"
top = "webapp_wrapper"
vendor = "eccelerators.com"
library = "samples"
name = "webapp"
version = "1.0"
display_name = "ArtyWebApp"
description = "Vivado IP generated from a Livt project"
taxonomy = "/UserIP"
include_tests = false
